<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNPDEA - Remontées de terrain</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>Remontées de terrain SNPDEA</h1>
  <p class="subtitle">Survolez ou touchez une région pour voir le détail du thème sélectionné.</p>

  <div class="layout">
  <div class="map-shell">
    <div class="map-image">
      <div class="bubble" data-region="HDF" style="left:151px;top:8px;width:84px;height:46px;">HDF</div>
      <div class="bubble" data-region="NOR" style="left:50px;top:59px;width:80px;height:46px;">NOR</div>
      <div class="bubble" data-region="IDF" style="left:160px;top:63px;width:76px;height:42px;">IDF</div>
      <div class="bubble" data-region="GES" style="left:248px;top:59px;width:92px;height:50px;">GES</div>
      <div class="bubble" data-region="BRE" style="left:8px;top:118px;width:76px;height:50px;">BRE</div>
      <div class="bubble" data-region="PDL" style="left:92px;top:122px;width:80px;height:46px;">PDL</div>
      <div class="bubble" data-region="CVL" style="left:181px;top:118px;width:80px;height:46px;">CVL</div>
      <div class="bubble" data-region="BFC" style="left:269px;top:118px;width:84px;height:50px;">BFC</div>
      <div class="bubble" data-region="NAQ" style="left:50px;top:181px;width:118px;height:76px;">NAQ</div>
      <div class="bubble" data-region="ARA" style="left:235px;top:181px;width:109px;height:76px;">ARA</div>
      <div class="bubble" data-region="OCC" style="left:92px;top:269px;width:126px;height:67px;">OCC</div>
      <div class="bubble" data-region="PACACOR" style="left:286px;top:269px;width:84px;height:50px;">PACA-Cor</div>
      <div class="bubble drom" data-region="DROM" style="left:286px;top:332px;width:84px;height:46px;">DROM-COM</div>
    </div>

    <div class="legend">
      <span><span class="swatch" style="background:var(--panel);"></span>Pas de remontée</span>
      <span><span class="swatch" style="background:var(--accent-bg);"></span>A répondu</span>
    </div>
  </div>

  <div class="controls">
    <label for="theme-select">Thème</label>
    <select id="theme-select">
      <option value="DDEA">DDEA</option> 
      <option value="TRM">Fiche de service - TRM</option> 
    </select>

    <div id="detail">
      <p style="font-size:13px;color:var(--text-muted);margin:0;">Survolez une région pour voir le détail complet.</p>
    </div>
  </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
